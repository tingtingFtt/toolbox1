name: Tavern import checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/test-tavern-import.mjs', 'package.json', 'package-lock.json', '.github/workflows/tavern-import-check.yml']
  pull_request:
    paths: ['src/**', 'scripts/test-tavern-import.mjs', 'package.json', 'package-lock.json', '.github/workflows/tavern-import-check.yml']
permissions:
  contents: read
jobs:
  import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --import tsx --test src/utils/presetResources.test.ts src/utils/baiduApi.test.ts src/utils/pagination.test.ts
      - run: npm run test:imports
      - run: npm run build
